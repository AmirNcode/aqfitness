- id: result-30
  order: 4
  firstName: Francisco
  quote: |-
    Francisco came to us because he wasn’t happy with how he felt, how he looked, or how he was performing on the field.
    Fast forward 3 months and the transformation goes far beyond the number on the scale.
    He lost weight, got stronger, started playing soccer pain-free again, and no longer felt like he needed an entire week to recover after every game. But what we’re most proud of isn’t the physical progress. Francisco stopped avoiding the things that were holding him back and chose to confront them head-on.
  image: ../assets/results/result-30.jpg
  videoUrl: null
  side: coaching
  featured: false
  placeholder: false

- id: result-31
  order: 3
  firstName: Janique
  quote: |-
    Janique is a machine! People talk about being busy, working long hours, demanding jobs and use that as an excuse to not take care of themselves.
    As a paramedic, Janique works 12-hour shifts. She works from 7 a.m. to 7 p.m.? No problem, she is at the gym at 5:30 a.m. Work from 7 p.m. to 7 a.m.? She is at the gym at 4:30 p.m. No matter her schedule, she will make it work. Fast forward a year working together and she has lost 15lb, due to her demanding schedule and job, she has become a meal prep ninja. Lifting heavier than ever, gotten multiple PRs in endurance events and the list goes on and on.
  image: ../assets/results/result-31.jpg
  videoUrl: null
  side: coaching
  featured: false
  placeholder: false

- id: result-32
