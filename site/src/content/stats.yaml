# Workplace-health figures, each checked against its primary source (Task 10, 2026-09-24).
# Deck claims that couldn't be verified were removed: "120 hours lost", "70% lower cognitive
# performance (Stanford 2023)", "20% higher productivity", and the "25–30%"/"2.5×" wording.
- id: presenteeism
  value: 77%
  label: of the productive time lost to common pain conditions came from people at work but not performing, not from absences.
  sourceTitle: Stewart et al., JAMA
  sourceUrl: https://pubmed.ncbi.nlm.nih.gov/14612481/
  year: 2003
  verified: true
  order: 1
- id: sick-days
  value: 2.4×
  label: higher rate of illness-related absence for employees who fall short of the recommended 150 minutes of activity a week.
  sourceTitle: Losina et al., PLOS One
  sourceUrl: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0176872
  year: 2017
  verified: true
  order: 2
- id: sick-leave
  value: ~25%
  label: lower sick leave, health plan and workers' compensation costs across 62 studies of worksite health programs.
  sourceTitle: Chapman, American Journal of Health Promotion
  sourceUrl: https://doi.org/10.4278/ajhp.26.4.tahp
  year: 2012
  verified: true
  order: 3
- id: absenteeism-return
  value: $2.73
  label: drop in absenteeism costs for every $1 spent on workplace wellness programs.
  sourceTitle: Baicker, Cutler & Song, Health Affairs
  sourceUrl: https://www.healthaffairs.org/doi/10.1377/hlthaff.2009.0626
  year: 2010
  verified: true
  order: 4
